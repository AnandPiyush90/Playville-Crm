# ============================================================
# DEV PROFILE — overrides for local development
# ============================================================

# Show SQL + formatted output in console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate validation relaxed in dev — update to see schema drift
spring.jpa.hibernate.ddl-auto=validate

# Verbose logging
logging.level.com.playville=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.security=DEBUG
logging.level.org.flywaydb=DEBUG

# Swagger always accessible in dev (no auth gate)
springdoc.swagger-ui.try-it-out-enabled=true

# Short JWT expiry in dev for easier testing
app.jwt.expiry-ms=3600000

# Error details visible in dev
server.error.include-message=always
server.error.include-stacktrace=on_param
server.error.include-binding-errors=always