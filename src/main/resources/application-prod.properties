# Production values are supplied through environment variables.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

app.jwt.secret=${PLAYVILLE_JWT_SECRET}
app.jwt.expiry-ms=${PLAYVILLE_JWT_EXPIRY_MS:86400000}

# Branch email credentials are stored encrypted in pv_email_provider_configs.
# This key must remain unchanged after provider settings are saved.
app.email.encryption-key=${PLAYVILLE_EMAIL_ENCRYPTION_KEY}
app.disclaimer.public-base-url=${PLAYVILLE_PUBLIC_DISCLAIMER_URL}
app.cors.allowed-origins=${PLAYVILLE_CORS_ALLOWED_ORIGINS}

server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

logging.level.com.playville=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO